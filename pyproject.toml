[project]
name = "kolhalashon"
version = "2.0.0"
description = "Typed Python wrapper for the Kol Halashon website API (search, shiurim, downloads, RSS)"
readme = "README.md"
authors = [{ name = "zvi shteinman" }]
requires-python = ">=3.10"
dependencies = ["cloudscraper>=1.2.71", "requests>=2.32.4"]
keywords = ["kolhalashon", "torah", "shiurim", "rss", "api"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Natural Language :: Hebrew",
]

[project.optional-dependencies]
dotenv = ["python-dotenv>=1.0.1"]

[project.urls]
Homepage = "https://github.com/ZviCode/KolHalashonApi"
Issues = "https://github.com/ZviCode/KolHalashonApi/issues"

[project.scripts]
kolhalashon = "kolhalashon.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "python-dotenv>=1.0.1",
    "ruff>=0.8",
    "types-requests>=2.32",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kolhalashon"]

[tool.hatch.build.targets.sdist]
include = ["kolhalashon", "tests", "README.md", "examples.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["kolhalashon", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real kolhalashon.com servers (deselect with -m 'not live')"]
addopts = "-m 'not live'"
